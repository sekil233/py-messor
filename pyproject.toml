[tool.poetry]
name = "py-messor"
version = "0.3.0"
description = "Async coroutine functions as queue-backed tasks (QueueFunc)."
authors = ["liuseki <liuseki@163.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/sekil233/py-messor"
repository = "https://github.com/sekil233/py-messor"
packages = [{ include = "messor" }]

[tool.poetry.urls]
Changelog = "https://github.com/sekil233/py-messor/blob/master/CHANGELOG.md"
Issues = "https://github.com/sekil233/py-messor/issues"

[tool.poetry.dependencies]
python = "^3.12"
orjson = "*"
pydantic = "^2.14.1"
aio-pika = { version = "^9.6", optional = true }

[tool.poetry.extras]
rabbit = ["aio-pika"]

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
priority = "primary"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-html = "*"
aio-pika = "^9.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

